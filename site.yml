title: "من نص إلى مفهوم"
short_title: "M2M"

# اسم المستودع بين شرطتين (إذا سمّيت المستودع USERNAME.github.io اكتب "/" فقط)
base: "/"
description: "من نص إلى مفهوم (M2M): ملخصات بالعربي لمفاهيم تقنية وسيبرانية، وقراءات في البحوث العلمية."

author:
  name: "معجب العتيبي"
  role: "محلل وباحث في مجال الأمن السيبراني"

# تعريف عن نفسك
intro: >-
  العلم يتجدد بين حين وآخر، وفي زماننا هذا تتجدد التقنية بتسارع لا تحدّه حدود.
  لكن من جعل نفسه في هذا المجال، لا بد أن يبقى مواكبًا، حتى تتسع آفاقه،
  وتقوى قدرته على اتخاذ القرار.

# المقصد من الصفحة
purpose: >-
  ومن خلال هذه الصفحة، أحوّل ما هو نصٌّ أمامي إلى معرفة أنقلها إلى شخصك،
  ونسهم معًا في نشر العلم.

# ملاحظة المشاركة
contribute:
  title: "عندك ملخص تريد نشره؟"
  text: >-
    إذا كتبت ملخصًا لمفهوم تقني أو قراءة في بحث، وتحب أن يُنشر هنا باسمك،
    راسلني ونراجعه معًا.

