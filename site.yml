hero_line: "أكتبُ بلغةٍ نفهمُها"
photo: ""          # مسار الصورة، مثل content/media/me.jpg (فاضي = لا تظهر صورة)

about:
  - "لكل تقنية غاية صُنعت لأجلها، ولها أثر لا يظهر إلا حين تخرج إلى العالم, حيث أن الشبكة التي وُجدت لتقرّب الناس بعضها لبعض أصبحت طريقًا إليهم، والنظام الذي بُني ليحفظ أصبح بابًا لمن يتربّص ,  وفي الأمن السيبراني هناك الوسيلة التي تُردّ التقنية إلى غايتها كلما حادت عنها."
  - "وما أكتبه هنا محاولةٌ لفهم هذا الحياد من جذوره, حتى يصبح الفهم أداةً لا تتقادم."

