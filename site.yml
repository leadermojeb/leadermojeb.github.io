sections:
  concepts:
    title: "المفاهيم التقنية"
    description: 'الأدوات تتبدّل والإصدارات تتقادم، أما المفاهيم فتبقى, هنا أكتب ما يبقى في "كيفية" عمل المفهوم من الداخل، وكيف يسلك طريقاً مختلفاً عن غايته.'
  research:
