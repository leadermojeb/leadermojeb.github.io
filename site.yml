hero_line: "أكتب بالعربي ما أتعلمه في الأمن السيبراني والتقنية، من سؤال إلى مفهوم."
photo: ""          # مسار الصورة، مثل content/media/me.jpg (فاضي = إطار مؤقت)

about:
  - "لكل تقنية غاية صُنعت لأجلها، ولها أثر لا يظهر إلا حين تخرج إلى العالم. الشبكة التي وُجدت لتقرّب الناس صارت طريقًا إليهم، والنظام الذي بُني ليحفظ صار بابًا لمن يتربّص. وفي المسافة بين ما أُريد للتقنية وما صارت إليه، يولد الأمن السيبراني."
  - "في هذه المسافة أعمل. أقرأ الأثر قبل أن أحكم، وأسأل كيف حدث قبل أن أسأل بأي أداة، فالأدوات تتبدّل، والفهم وحده ما يبقى."

