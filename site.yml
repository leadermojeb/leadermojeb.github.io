description: "من سؤال إلى مفهوم (M2M, Mind to Mind): ملخصات بالعربي لمفاهيم تقنية وسيبرانية، وقراءات في البحوث العلمية."

author:
  name: "معجب العتيبي"
  role: "محلل وباحث في مجال الأمن السيبراني"

# تعريف عن نفسك
intro: 'العلم يتجدد بين حين وآخر، وفي زماننا هذا تتجدد التقنية بتسارع لا تحدّه حدود, لكن من جعل نفسه في هذا المجال، لا بد أن يبقى مواكبًا، حتى تتسع آفاقه، وتقوى قدرته على اتخاذ القرار.'

# المقصد من الصفحة
purpose: 'ومن خلال هذه الصفحة، أحوّل ما هو نصٌّ أمامي إلى معرفة أنقلها إلى شخصك، ونسهم معًا في نشر العلم.'

# ملاحظة المشاركة
contribute:
  title: "شاركني الطريق"
  text: >-
    هذا الدفتر مفتوح لمن يرى في العلم ما أراه, إن كتبت ملخصًا لمفهوم تقني أو قراءة في بحث، فلك هنا مساحة تحمل اسمك, راسلني، ونراجعه سويًا قبل النشر.

