# تعريف عن نفسك
intro: >-
  لا يكفيني أن أعرف أن التنبيه انطلق؛ أريد أن أفهم النظام خلفه:
  كيف يعمل، وأين يُستغل، وما الدليل الذي يكشفه.

# المقصد من الصفحة
purpose: >-
  هذه الصفحة دفتري المفتوح: ملخصات لمفاهيم تقنية، وقراءات في بحوث علمية،
  بالعربي وبلغة بسيطة. أتعلّم بصوت مسموع، ومن يتعلّم معي مرحّب به.

