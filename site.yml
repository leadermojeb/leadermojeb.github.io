about:
  - "بدأت دراستي في إدارة الأعمال، ثم قادني الفضول إلى علوم الحاسب، ومنها إلى الأمن السيبراني الدفاعي. تخرجت من جامعة الإمام عبدالرحمن بن فيصل، وأعمل اليوم محللًا في مركز عمليات الأمن (SOC)."
  - "أهتم بفهم الأنظمة من الداخل، وببناء معرفة تنتقل معي بين الأدوات والوظائف، لا تنتهي بانتهاء أداة."

method:
  title: "طريقتي في التحقيق"
  lead: "كل تنبيه سؤال، والإجابة تُبنى على الدليل لا على الانطباع."
  steps:
    - title: "الحقائق"
      text: "أجمع ما حدث فعلًا من السجلات قبل أي تفسير: من، ومتى، ومن أين."
    - title: "الفرضية"
      text: "أبني تفسيرًا قابلًا للاختبار: سلوك طبيعي، أم إساءة استخدام؟"
    - title: "الدليل"
      text: "أبحث عمّا يؤكد الفرضية أو ينفيها، لا عمّا يؤيدها فقط."
    - title: "القرار"
      text: "إغلاق، أو تصعيد، أو متابعة، مع ملاحظة تستند إلى الدليل."

journey:
  - when: "2026"
    title: "محلل أمن سيبراني في مركز عمليات الأمن (SOC)"
    note: "[جهة العمل، إن رغبت بذكرها]"
  - when: "2026"
    title: "بكالوريوس علوم الحاسب"
