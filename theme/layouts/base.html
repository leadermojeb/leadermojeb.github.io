<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.title }}{% if site.short_title %} | {{ site.short_title }}{% endif %}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ site.description }}{% endblock %}">
  <meta name="theme-color" content="#16243A">
  <link rel="canonical" href="{{ page_url }}">
  <meta property="og:type" content="{% block og_type %}website{% endblock %}">
  <meta property="og:site_name" content="{{ site.title }} | {{ site.short_title }}">
  <meta property="og:locale" content="ar_SA">
  <meta property="og:title" content="{{ self.title()|trim }}">
  <meta property="og:description" content="{{ self.description()|trim }}">
  <meta property="og:url" content="{{ page_url }}">
  <meta property="og:image" content="{{ site.url }}/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ site.title }}، {{ site.short_title }}: {{ site.tagline }}">
  <meta name="twitter:card" content="summary_large_image">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preload" href="{{ root }}assets/fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="{{ root }}assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="{{ root }}assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="{{ root }}assets/apple-touch-icon.png">
  <link rel="stylesheet" href="{{ root }}assets/style.css">
  {% block head %}{% endblock %}
</head>
<body class="page-{{ page }}">
  <a class="skip" href="#main">تخطَّ إلى المحتوى</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ root }}">
        <svg class="brand-mark" viewBox="8 7 84 84" aria-hidden="true">
          <path d="M68 32 C68 21 60 14 50 14 C39 14 32 22 32 32 C32 42 42 45 50 50 L50 61" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
          <rect class="end" x="42" y="72" width="16" height="16" />
        </svg>
        <span>{{ site.short_title or site.title }}</span>
      </a>
      <div class="header-tools">
        <nav class="site-nav" aria-label="الأقسام">
          <a href="{{ root }}concepts/"{% if page == 'concepts' %} aria-current="page"{% endif %}>المفاهيم</a>
          <a href="{{ root }}research/"{% if page == 'research' %} aria-current="page"{% endif %}>البحوث</a>
          <a href="{{ root }}#contact">للتواصل</a>
        </nav>
        <button class="theme-toggle" type="button" aria-label="تبديل الوضع الفاتح والداكن">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    {% block main %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div>
        <p class="footer-name">{{ site.author.name }}</p>
        <p class="footer-note">{{ site.footer_note }}</p>
      </div>
      <ul class="contact-list">
        {% for c in site.contacts %}
        <li><a href="{{ c.url }}" rel="me noopener">{{ c.label }}</a></li>
        {% endfor %}
      </ul>
    </div>
  </footer>
  <script>
    (function () {
      var root = document.documentElement;
      var btn = document.querySelector('.theme-toggle');
      function label() {
        btn.setAttribute('aria-pressed', root.getAttribute('data-theme') === 'dark' ? 'true' : 'false');
      }
      label();
      btn.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        label();
      });
      // إذا الزائر ما اختار بنفسه، نتبع تغيّر إعداد الجهاز
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      (mq.addEventListener ? mq.addEventListener.bind(mq, 'change') : mq.addListener.bind(mq))(function (e) {
        var saved = null;
        try { saved = localStorage.getItem('theme'); } catch (err) {}
        if (!saved) { root.setAttribute('data-theme', e.matches ? 'dark' : 'light'); label(); }
      });
    })();
  </script>
</body>
</html>
